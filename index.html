function uniqueFacts(){
  const seen=new Set(), out=[];
  for(const x of BANKS[state.mod]){
    const key=x.exp||x.answer;
    if(!seen.has(key)){seen.add(key);out.push(x)}
  }
  return out.slice(0, Math.min(10,out.length));
}
function content(){
  const facts=uniqueFacts();
  body.innerHTML=`<div class="af-note">📌 Base: material da disciplina e Plano Mestre. Cada cartão abaixo representa um conceito distinto do banco deste módulo.</div><div class="af-grid">${facts.map((x,i)=>`<div class="af-card"><h3>${i+1}. ${esc(x.answer)}</h3><p>${esc(x.exp)}</p></div>`).join('')}</div>`
}
function map(){
  const facts=uniqueFacts();
  body.innerHTML=`<div class="af-card"><h2>🗺️ Mapa mental — ${esc(NAMES[state.mod])}</h2><div class="af-grid">${facts.map((x,i)=>`<div class="af-card"><b>${i+1}. ${esc(x.answer)}</b><p>${esc(x.exp)}</p></div>`).join('')}</div></div>`
}
function flash(){
  const facts=uniqueFacts(), x=facts[state.fc%facts.length];
  body.innerHTML=`<div class="af-card"><h2>🃏 Flashcard ${state.fc%facts.length+1}/${facts.length}</h2><div id="afFc" class="af-fc">${state.flip?`<div><b>Resposta:</b> ${esc(x.answer)}<br><br>${esc(x.exp)}</div>`:`<div><b>${esc(x.q)}</b><br><span class="af-muted">Clique para revelar a resposta</span></div>`}</div><div class="af-tabs"><button type="button" id="afFlip">${state.flip?'Ocultar resposta':'Revelar resposta'}</button><button type="button" data-rate="wrong">❌ Errei</button><button type="button" data-rate="hard">⚠️ Difícil</button><button type="button" data-rate="right">✅ Acertei</button><button type="button" id="afNext">Próximo →</button></div></div>`;
  document.getElementById('afFc').onclick=()=>{state.flip=!state.flip;flash()};
  document.getElementById('afFlip').onclick=()=>{state.flip=!state.flip;flash()};
  document.getElementById('afNext').onclick=()=>{state.fc=(state.fc+1)%facts.length;state.flip=false;flash()};
  body.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{try{localStorage.setItem(`af_fc_${state.mod}_${state.fc%facts.length}`,b.dataset.rate)}catch(e){}state.fc=(state.fc+1)%facts.length;state.flip=false;flash()})
}
function question(){const a=BANKS[state.mod],x=a[state.qi],key=state.mod+':'+state.qi,ch=state.answers[key];const opts=x.opts.map((o,i)=>{const l=LET[i],cl=ch?(l===x.a?'good':l===ch?'bad':''):'';return `<button type="button" class="af-opt ${cl}" data-opt="${l}" ${ch?'disabled':''}><b>${l})</b> ${esc(o)}</button>`}).join('');const ans=Object.keys(state.answers).filter(k=>k.startsWith(state.mod+':')).length,cor=Object.entries(state.answers).filter(([k,v])=>k.startsWith(state.mod+':')&&v===a[+k.split(':')[1]].a).length;const fb=ch?`<div class="af-answer"><b>${ch===x.a?'✅ Acertou':'❌ Errou'}</b><br>Resposta: <b>${x.a}) ${esc(x.answer)}</b><br>${esc(x.exp)}</div>`:'';body.innerHTML=`<div class="af-card"><h2>📝 Questão ${state.qi+1}/50</h2><p>${esc(x.q)}</p>${opts}${fb}<div class="af-tabs"><button type="button" id="afPrev">← Anterior</button><button type="button" id="afNextQ">Próxima →</button><button type="button" id="afReset">↺ Reiniciar módulo</button></div><p class="af-stat">Respondidas: ${ans}/50 • Acertos: ${cor}</p></div>`;body.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{state.answers[key]=b.dataset.opt;save();render()});document.getElementById('afPrev').onclick=()=>{state.qi=Math.max(0,state.qi-1);question()};document.getElementById('afNextQ').onclick=()=>{state.qi=Math.min(49,state.qi+1);question()};document.getElementById('afReset').onclick=()=>{Object.keys(state.answers).filter(k=>k.startsWith(state.mod+':')).forEach(k=>delete state.answers[k]);state.qi=0;save();render()}}
app.querySelectorAll('[data-af-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.afTab;save();render()});
function openFinal(n){state.mod=Number(n)||1;save();document.querySelector('main')?.style.setProperty('display','none','important');document.querySelectorAll('.v21-page').forEach(x=>x.classList.remove('active'));app.style.display='block';render();window.scrollTo({top:0,behavior:'smooth'})}
openFinal(state.mod);
window.anatomiaFinalAudit=()=>({
      modules:Object.keys(BANKS).length,
      questions:Object.values(BANKS).reduce((s,a)=>s+a.length,0),
      questionsPerModule:Object.fromEntries(Object.entries(BANKS).map(([k,v])=>[k,v.length])),
      uniqueFactsPerModule:Object.fromEntries(Object.entries(BANKS).map(([k,v])=>[k,new Set(v.map(x=>x.exp||x.answer)).size])),
      flashcardsPerModule:Object.fromEntries(Object.entries(BANKS).map(([k,v])=>[k,new Set(v.map(x=>x.exp||x.answer)).size])),
      tabs:4,localStorage:true
    });
})();

</script></body></html>
